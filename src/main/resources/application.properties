spring.application.name=reservas-salas

# Por defecto: H2 en memoria (arranca sin instalar nada). Perfil "postgres" para PostgreSQL.
spring.datasource.url=jdbc:h2:mem:reservas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# El esquema lo gestiona Flyway; Hibernate solo valida que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}

spring.h2.console.enabled=true

# Seguridad. Valores por defecto SÓLO para desarrollo: en otro entorno se sobrescriben con variables de entorno.
app.seguridad.usuario=${APP_USUARIO:admin}
app.seguridad.clave=${APP_CLAVE:admin123}
# Clave HMAC para firmar los JWT (HS256): mínimo 32 bytes.
app.seguridad.jwt-secreto=${APP_JWT_SECRETO:clave-de-desarrollo-cambiar-en-produccion-0123456789}
app.seguridad.jwt-duracion=1h
