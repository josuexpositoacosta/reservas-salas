spring.application.name=reservas-salas

# Si no se indica ningún perfil, se usa "dev" (H2 y credenciales de desarrollo).
# Con cualquier otro perfil (postgres, prod...) las credenciales son obligatorias.
spring.profiles.default=dev

# H2 en memoria salvo que un perfil diga otra cosa (ver application-postgres.properties).
spring.datasource.url=jdbc:h2:mem:reservas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# El esquema lo gestiona Flyway; Hibernate solo valida que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}

spring.h2.console.enabled=false

# Seguridad: sin valores por defecto. Si falta alguna variable, la aplicación no arranca
# (PropiedadesSeguridad está validada), en vez de arrancar con un secreto conocido.
app.seguridad.usuario=${APP_USUARIO:}
app.seguridad.clave=${APP_CLAVE:}
# Clave HMAC para firmar los JWT (HS256): mínimo 32 caracteres.
app.seguridad.jwt-secreto=${APP_JWT_SECRETO:}
app.seguridad.jwt-duracion=1h

# Paginación: nadie puede pedir más de 100 elementos por página
spring.data.web.pageable.max-page-size=100
